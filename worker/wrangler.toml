name = "sport-spectator-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Runs every minute; the scheduled() handler decides which jobs fire.
# Live scores refresh on every tick, the wire every 15 min, Instagram every 6 hours.
[triggers]
crons = ["* * * * *"]

# Create with:  npx wrangler kv namespace create SS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Secrets — set these with `npx wrangler secret put NAME`, never commit them:
#   IG_TOKEN           long-lived Instagram token (seeds KV on first run)
#   ANTHROPIC_API_KEY  for the weekly games-of-the-week proposal
#   ADMIN_KEY          random string protecting /api/refresh and /approve
