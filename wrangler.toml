# One Worker serves the site and the API.
# Static assets are matched first; /api/* falls through to the Worker.

name = "sport-spectator"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"      # Astro build output, not public/
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "SS"
id = "84bb007f0bd0445cb47ee23cf03ea1a1"
