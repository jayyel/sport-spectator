name: Generate Tina lock file

# Builds the Tina schema and commits tina/tina-lock.json AND tina/__generated__
# back to the repo. TinaCloud reads both to index your content.
#
# Run by hand from the Actions tab, or automatically when tina/config.ts changes.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tina/config.ts'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Diagnostics
        run: |
          node --version
          npx tinacms --version || echo "tinacms CLI did not resolve"
          echo "--- tina/ ---"
          ls -la tina/ 2>/dev/null || echo "no tina directory"

      # --skip-cloud-checks bypasses the branch-status check, which is what
      #   blocks a first run: the branch can't be on TinaCloud until a lock
      #   file exists, and the lock file can't build until the check passes.
      # --skip-indexing avoids uploading a search index we don't need yet.
      - name: Build Tina schema
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: npx tinacms build --skip-cloud-checks --skip-indexing

      - name: Show what was generated
        run: |
          find tina -type f -not -path '*/node_modules/*' | head -40

      - name: Commit generated Tina files
        run: |
          if [ -n "$(git status --porcelain tina/)" ]; then
            git config user.name  "Sport Spectator bot"
            git config user.email "bot@thesportspectator.com"
            git add -f tina/
            git commit -m "Generate Tina schema and lock file"
            git push
            echo "Committed."
          else
            echo "Nothing changed in tina/."
          fi
